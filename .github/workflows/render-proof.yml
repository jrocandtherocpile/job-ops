name: Render proof (temporary)

on:
  push:
    branches: [ci/render-contact-line]

permissions:
  contents: read

env:
  PROOF: src/server/services/resume-renderer/typst.render-proof.test.ts
  THEME: orchestrator/src/server/services/resume-renderer/typst-themes/clean-print-cv/main.typ

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci --workspaces --include-workspace-root
      - name: Build better-sqlite3
        run: npm --workspace orchestrator rebuild better-sqlite3
      - name: Install Typst and pdftotext
        run: |
          curl -fsSL -o /tmp/typst.tar.xz https://github.com/typst/typst/releases/download/v0.14.2/typst-x86_64-unknown-linux-musl.tar.xz
          mkdir -p /tmp/typst
          tar -xJf /tmp/typst.tar.xz -C /tmp/typst --strip-components=1
          sudo install -m 0755 /tmp/typst/typst /usr/local/bin/typst
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          typst --version
      - name: Render the patched theme
        env:
          RENDER_PROOF_DIR: ${{ github.workspace }}/render-proof/patched
        run: npm --workspace orchestrator run test:run -- "$PROOF"
      - name: Control - must fail on the unpatched theme
        env:
          RENDER_PROOF_DIR: ${{ github.workspace }}/render-proof/unpatched
        run: |
          git show "HEAD~1:$THEME" > "$THEME"
          if npm --workspace orchestrator run test:run -- "$PROOF" -t "no stray separators"; then
            echo "::error::Control passed on the unpatched theme"
            exit 1
          fi
          echo "Control failed as expected"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: render-proof-pdfs
          path: render-proof/
